services:
  # ----------------------------------------------------------------------------
  # 1. C++ High-Performance In-Memory Database Engine
  # ----------------------------------------------------------------------------
  redisx:
    image: ${ENGINE_IMAGE:-ghcr.io/prashantbhushan-repo/pbredisdb-engine:latest}
    container_name: redisx-server
    command: ["-h", "0.0.0.0", "-p", "6379", "-c", "/etc/redisx/redis.conf"]
    ports:
      - "6379:6379"
      - "9121:9121"
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ./infra/configs/pbRedis.prod.conf:/etc/redisx/redis.conf:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.80'
          memory: 384M
        reservations:
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 6379 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------------------------
  # 2. Fastify API Gateway & Safety Validation Layer
  # ----------------------------------------------------------------------------
  gateway:
    image: ${GATEWAY_IMAGE:-ghcr.io/prashantbhushan-repo/pbredisdb-gateway:latest}
    container_name: redisx-gateway
    ports:
      - "4000:4000"
    env_file:
      - .env.production
    environment:
      - REDIS_HOST=redisx
      - REDIS_PORT=6379
      - NODE_ENV=production
      - DEMO_MODE=false
      - DEMO_FALLBACK=false
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          memory: 64M
    depends_on:
      redisx:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 3. React 18 Studio Web Visualizer & Playground
  # ----------------------------------------------------------------------------
  web:
    image: ${WEB_IMAGE:-ghcr.io/prashantbhushan-repo/pbredisdb-web:latest}
    container_name: redisx-web
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
        reservations:
          memory: 16M
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

  # ----------------------------------------------------------------------------
  # 4. Prometheus Telemetry & Metrics Scraper
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: redisx-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
        reservations:
          memory: 64M
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redisx:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ----------------------------------------------------------------------------
  # 5. Grafana Real-Time Observability Dashboards
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    container_name: redisx-grafana
    ports:
      - "3002:3002"
    environment:
      - GF_SERVER_HTTP_PORT=3002
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_ALLOW_SIGN_UP=false
    deploy:
      resources:
        limits:
          cpus: '0.30'
          memory: 256M
        reservations:
          memory: 64M
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  prometheus-data:
  grafana-data:
