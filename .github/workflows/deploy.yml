name: CI/CD - Build & Deploy to AWS EC2

on:
  push:
    branches:
      - main
      - feature/packaging-and-docs
      - feature/redis-studio
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: false
        default: 'main'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: prashantbhushan-repo

jobs:
  # ============================================================================
  # 1. CI Quality Gate: Run Automated Tests First (Never deploy broken code!)
  # ============================================================================
  test:
    name: Run Automated Tests & Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install C++ Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-12 libssl-dev openssl python3

      - name: Configure CMake (Debug)
        run: cmake --preset debug

      - name: Build Engine & Test Suite
        run: cmake --build --preset debug

      - name: Run C++ Unit Tests
        run: ctest --preset debug --output-on-failure --timeout 30

  # ============================================================================
  # 2. CI: Build Docker Images on GitHub Actions & Push to GHCR (Runs ONLY if tests pass!)
  # ============================================================================
  build-and-push:
    name: Build & Push Images (GHCR)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1. Build C++ Engine
      - name: Build & Push RedisX C++ Engine
      # 1. Build C++ Engine
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.engine
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/pbredisdb-engine:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/pbredisdb-engine:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build Fastify API Gateway
      - name: Build & Push Fastify API Gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.gateway
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/pbredisdb-gateway:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/pbredisdb-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Build React Studio Web UI
      - name: Build & Push React Studio Web UI
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/pbredisdb-web:latest
            ghcr.io/${{ env.IMAGE_OWNER }}/pbredisdb-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. CD: SSH to EC2, Pull Pre-Built Images & Run with Docker Compose
  # ============================================================================
  deploy:
    name: Deploy to EC2
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Create Remote App Directory on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            mkdir -p /home/${{ secrets.EC2_USER }}/pbRedisDB/data
            # Clean up accidental directories if docker bind-mount created them when file was absent
            if [ -d "/home/${{ secrets.EC2_USER }}/pbRedisDB/infra/configs/pbRedis.prod.conf" ]; then
              rm -rf "/home/${{ secrets.EC2_USER }}/pbRedisDB/infra/configs/pbRedis.prod.conf"
            fi

      - name: Prepare Deployment Configs
        run: |
          cp .env.production infra/configs/.env.production

      - name: Copy Deployment Configs to EC2 (Zero Source Code)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "docker-compose.prod.yml,.env.production,infra/configs,infra/monitoring,infra/scripts"
          target: "/home/${{ secrets.EC2_USER }}/pbRedisDB"

      - name: Deploy Containers on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: GH_TOKEN,GH_ACTOR
          script_stop: true
          script: |
            echo "=========================================================="
            echo "🚀 Starting Deployment on AWS EC2 (Zero Source Code Mode)"
            echo "=========================================================="

            cd "/home/${{ secrets.EC2_USER }}/pbRedisDB"

            # Ensure .env.production is in root
            if [ -f "infra/configs/.env.production" ]; then
              cp -f infra/configs/.env.production .env.production
            fi

            echo "==> Authenticating Docker with GitHub Container Registry..."
            echo "${GH_TOKEN}" | docker login ghcr.io -u "${GH_ACTOR}" --password-stdin

            echo "==> Pulling pre-built images from GitHub Container Registry..."
            docker compose -f docker-compose.prod.yml pull

            echo "==> Launching full production stack (Zero compile overhead on EC2)..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            echo "==> Waiting for container startup & healthchecks..."
            sleep 10
            docker compose -f docker-compose.prod.yml ps

            echo "==> Pruning dangling image layers to conserve disk space..."
            docker image prune -f

            echo "=========================================================="
            echo "✅ Deployment completed successfully in seconds!"
            echo "=========================================================="
