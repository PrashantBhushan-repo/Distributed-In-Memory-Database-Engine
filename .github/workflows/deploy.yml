name: CI/CD - Build & Deploy to AWS EC2

on:
  push:
    branches: [main, feature/packaging-and-docs, feature/redis-studio]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch or commit to deploy
        required: false
        default: main

permissions:
  contents: read
  packages: write

# All deployment branches share one host. Do not cancel a database deployment.
concurrency:
  group: ec2-production
  cancel-in-progress: false

env:
  IMAGE_OWNER: prashantbhushan-repo

jobs:
  test:
    name: Resolve release and run quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.sha }}
      - id: revision
        name: Resolve exact source revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build and test applications
        run: |
          npm ci --prefix studio/gateway
          npm ci --prefix studio/web
          npm run build
          npm test
      - name: Install engine dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-12 libssl-dev openssl python3 shellcheck
      - run: cmake --preset debug
      - run: cmake --build --preset debug
      - run: ctest --preset debug --output-on-failure --timeout 30
      - name: Check deployment shell scripts
        run: |
          bash -n infra/scripts/deploy-ec2.sh
          bash -n infra/scripts/prepare-storage.sh
          bash -n infra/scripts/inspect-ec2.sh
          bash -n tests/scripts/test_deployment.sh
          shellcheck infra/scripts/deploy-ec2.sh infra/scripts/prepare-storage.sh infra/scripts/inspect-ec2.sh tests/scripts/test_deployment.sh
          python3 tests/scripts/test_deploy_orchestration.py

  build-and-push:
    name: Build immutable images and test persistence
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      engine: ${{ steps.engine.outputs.digest }}
      gateway: ${{ steps.gateway.outputs.digest }}
      web: ${{ steps.web.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.revision }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build engine
        id: engine
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.engine
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/pbredisdb-engine:${{ needs.test.outputs.revision }}
          cache-from: type=gha,scope=engine
          cache-to: type=gha,mode=max,scope=engine
      - name: Build gateway
        id: gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.gateway
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/pbredisdb-gateway:${{ needs.test.outputs.revision }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway
      - name: Build web
        id: web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.web
          push: true
          tags: ghcr.io/${{ env.IMAGE_OWNER }}/pbredisdb-web:${{ needs.test.outputs.revision }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Verify bind-mount permissions and restart durability
        env:
          ENGINE_IMAGE: ghcr.io/${{ env.IMAGE_OWNER }}/pbredisdb-engine@${{ steps.engine.outputs.digest }}
        run: bash tests/scripts/test_deployment.sh

  deploy:
    name: Deploy and verify EC2
    needs: [test, build-and-push]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.test.outputs.revision }}
      - name: Prepare immutable release manifest
        env:
          ENGINE_DIGEST: ${{ needs.build-and-push.outputs.engine }}
          GATEWAY_DIGEST: ${{ needs.build-and-push.outputs.gateway }}
          WEB_DIGEST: ${{ needs.build-and-push.outputs.web }}
        run: |
          printf 'ENGINE_IMAGE=ghcr.io/%s/pbredisdb-engine@%s\nGATEWAY_IMAGE=ghcr.io/%s/pbredisdb-gateway@%s\nWEB_IMAGE=ghcr.io/%s/pbredisdb-web@%s\n' \
            "$IMAGE_OWNER" "$ENGINE_DIGEST" "$IMAGE_OWNER" "$GATEWAY_DIGEST" "$IMAGE_OWNER" "$WEB_DIGEST" > images.env
      - name: Upload versioned runtime files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: docker-compose.prod.yml,.env.production,images.env,infra/configs,infra/monitoring,infra/scripts
          target: /home/${{ secrets.EC2_USER }}/pbRedisDB/.deploy/releases/${{ github.run_id }}-${{ github.run_attempt }}
      - name: Prepare host, deploy and verify
        uses: appleboy/ssh-action@v1.0.3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: GH_TOKEN,GH_ACTOR
          command_timeout: 18m
          script_stop: true
          script: |
            set -eu
            export APP_ROOT="/home/${{ secrets.EC2_USER }}/pbRedisDB"
            bash "$APP_ROOT/.deploy/releases/${{ github.run_id }}-${{ github.run_attempt }}/infra/scripts/deploy-ec2.sh"
