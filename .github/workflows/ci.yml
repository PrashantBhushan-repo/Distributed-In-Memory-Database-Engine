name: RedisX CI

on:
  push:
    branches: [ main, master, stage-* ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.preset }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, asan]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Reject tracked Node dependencies and build output
        shell: bash
        run: |
          generated=$(git ls-files -- ':(glob)**/node_modules/**' 'studio/gateway/dist/**' 'studio/web/dist/**')
          if [ -n "$generated" ]; then
            echo '::error::Generated Node files are tracked. Untrack node_modules and Studio dist directories; keep package.json and lockfiles.'
            exit 1
          fi

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-12 libssl-dev openssl python3

      - name: Configure CMake
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Run Tests
        run: ctest --preset ${{ matrix.preset }} --output-on-failure --timeout 30
