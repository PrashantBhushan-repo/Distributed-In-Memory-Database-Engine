# ==============================================================================
# pbRedisDB - LOCAL DEVELOPMENT CONFIGURATION (pbRedis.dev.conf)
# ==============================================================================

# Network & Connectivity
port 6379
bind 0.0.0.0
tcp-backlog 128
timeout 0
tcp-keepalive 60

# Memory Management (Unlimited on local dev machine)
maxmemory 0
maxmemory-policy noeviction

# Persistence (Disabled for fast local dev cycles & tests)
appendonly no
save ""
dir /data
dbfilename dump.rdb

# Observability
slowlog-log-slower-than 10000
slowlog-max-len 128
requirepass ""
