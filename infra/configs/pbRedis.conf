# ==============================================================================
# pbRedisDB Production Server Configuration
# ==============================================================================

# Network & Connectivity
port 6379
bind 0.0.0.0
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory Management (256MB bounds for t3.small EC2 tier)
maxmemory 268435456
maxmemory-policy volatile-lru

# Persistence (RDB Snapshotting & AOF Durability)
appendonly yes
appendfsync everysec
save "900 1 300 10 60 10000"
dir /data
dbfilename dump.rdb

# Observability & Diagnostics
slowlog-log-slower-than 10000
slowlog-max-len 128
requirepass ""
